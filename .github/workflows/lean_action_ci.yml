name: Lean Action CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Two pushes of the same commit seconds apart (or rapid successive pushes)
# each fire the full ~11-minute matrix; only the newest run per ref matters,
# so supersede the older instead of running it out. Grouped per ref, so a
# pull request never cancels main's run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      # Never cancel one platform because another failed. These legs fail for
      # genuinely different reasons — the whole point of running them is to see
      # each one's result — and the default (fail-fast: true) threw away the
      # Linux result the moment a flaky macOS timing test failed. Releases
      # attest this complete matrix for the exact tagged commit.
      fail-fast: false
      matrix:
        # Three legs, one per axis that actually varies. The ~770 pure-Lean
        # modules are platform-independent and elan pins the compiler to one
        # commit, so adding distros would re-test identical `.olean` semantics.
        # Everything that varies lives at the FFI boundary:
        #
        #   ubuntu-24.04       Linux x86_64 — the sealed-DuckDB path, amd64 asset
        #                      (pinned, like the arm leg: a new Ubuntu is a new
        #                      glibc/g++ for the FFI link, so moving to it is a
        #                      deliberate change, not a runner-label migration)
        #   ubuntu-24.04-arm   Linux arm64  — the `static-libs-linux-arm64.zip`
        #                      branch of `duckdbArchiveName`, which no CI run had
        #                      ever executed, plus arm64 static-libstdc++ discovery
        #   macos-latest       Darwin arm64 — the dynamic dylib path, no sealing
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    # The private half of `typednotes/test`'s read-only deploy key, for
    # `gitfn-remote` below. Empty where secrets are not available (forks'
    # pull requests).
    env:
      GITFN_DEPLOY_KEY: ${{ secrets.GITFN_DEPLOY_KEY }}

    steps:
      - uses: actions/checkout@v7
      - name: Offline release gate regressions
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: bash ci/test-require-main-ci.sh
      # Installs libpq, OpenSSL and (on Linux) libsecret from the canonical list.
      - uses: ./.github/actions/setup-native-deps
      # `test: false`: the suite runs in the named step below instead.
      - uses: leanprover/lean-action@v1
        with:
          test: false
      # `LinenTest` is not a default target, so `lean-action`'s `lake build` does
      # not reach it. Run it explicitly on every matrix leg: AGENTS.md
      # requires the full test suite to run on each platform axis whenever an
      # FFI target is in the build graph, and every `#guard`/`#guard_msgs`
      # check in the suite runs at elaboration time — so `lake test` (the
      # package's test driver, which builds `LinenTest`) *is* running the tests.
      - name: Build the test suite (runs every #guard check)
        run: lake test

      - uses: ./.github/actions/check-http2
        timeout-minutes: 10

      # A symbol table is not observable from a `#guard`, and getting this
      # wrong aborts the process on every DuckDB error path rather than failing
      # the build. The seal is a property of a linked binary, so it is asserted
      # on the artifact; the script skips itself on macOS. Releases require
      # this workflow to have passed on the exact tagged commit.
      - name: Verify the sealed DuckDB library is self-contained
        run: ./ci/check-sealed-duckdb.sh

      # `System.GitFn` end to end: a local, partly hostile fixture repository
      # is fetched, checked by the secure policy, compiled by nested Lake
      # builds and called over stdio and HTTP, and the test asserts that none
      # of the fixture's own code (lakefile, `#eval`) ever ran. Not a
      # `#guard`: it needs git, spawns processes and runs builds.
      #
      # Both GitFn steps are bounded: they spawn processes and nested builds,
      # and each prints its results only at the end, so an unbounded hang
      # shows nothing and holds the job for hours. (`gitfn-remote` once
      # swapped for 30 silent minutes before being cancelled: every build
      # leaked a Lean environment, and 24 of them outgrew the runner.) Both
      # take a few minutes.
      - name: GitFn integration test
        timeout-minutes: 15
        run: lake exe gitfn-integration

      # `System.GitFn` against a real, private GitHub repository:
      # `typednotes/test` at the commit pinned in `Integration/GitFnRemote.lean`,
      # fetched by SHA and checked against the expectations it carries
      # (`gitfn.json`). One leg: what it adds over `gitfn-integration` is the
      # network fetch and more cases, not a platform axis.
      #
      # Access is the repository's read-only deploy key. The descriptor keeps
      # its HTTPS URL; an `insteadOf` scoped to that one repository sends git
      # there over SSH, with the key, so no other fetch of the job uses it.
      # GitHub's SSH host keys come from its API, over HTTPS, not from the
      # first connection.
      - name: GitFn remote test (typednotes/test)
        if: matrix.os == 'ubuntu-24.04' && env.GITFN_DEPLOY_KEY != ''
        timeout-minutes: 20
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$GITFN_DEPLOY_KEY" > "$HOME/.ssh/gitfn_test"
          chmod 600 "$HOME/.ssh/gitfn_test"
          curl -fsSL https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' > "$HOME/.ssh/gitfn_known_hosts"
          git config --global url."git@github.com:typednotes/test".insteadOf https://github.com/typednotes/test
          git config --global core.sshCommand "ssh -i $HOME/.ssh/gitfn_test -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/gitfn_known_hosts -o StrictHostKeyChecking=yes"
          lake exe gitfn-remote
      - name: GitFn remote test skipped
        if: matrix.os == 'ubuntu-24.04' && env.GITFN_DEPLOY_KEY == ''
        run: echo "::warning::GITFN_DEPLOY_KEY is not set; the GitFn remote test (typednotes/test) did not run"

  # ── Can a consumer build against this? ──────────────────────────────────────
  #
  # The axis standalone CI cannot test. When `linen` is a dependency, Lake
  # elaborates its lakefile with the *consumer's* root as the working directory
  # while writing target outputs to `linen`'s own build directory. Built
  # standalone the two coincide, so this repository's own green CI said nothing
  # about it — and a `-L` resolved against the wrong one broke every Linux
  # consumer while CI stayed green (fixed in 0.19.1).
  #
  # Only the FFI-bearing modules are imported: the point is to link, not to
  # re-run a suite the matrix above already ran.
  consumer:
    name: Consumer build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: linen
      - uses: ./linen/.github/actions/setup-native-deps
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: linen
          build: false
          test: false
      - name: Build a package that requires linen as a dependency
        run: |
          set -euo pipefail
          mkdir -p consumer
          cd consumer
          cp ../linen/lean-toolchain .
          cat > lakefile.lean <<'LAKE'
          import Lake
          open System Lake DSL

          require linen from ".." / "linen"
          LAKE
          # The link helpers are the canonical block consumers copy
          # (`ci/consumer/link-helpers.lean`), spliced in rather than written
          # out here, so this job's executable link is what tests that block —
          # and the checker is run on the result, so it is tested too.
          cat ../linen/ci/consumer/link-helpers.lean >> lakefile.lean
          cat >> lakefile.lean <<'LAKE'

          open Lean Elab Command in
          run_cmd do
            let mkDef (n : Name) (flags : Array String) : CommandElabM Unit := do
              let lits : Array (TSyntax `term) := flags.map (fun s => quote s)
              elabCommand (← `(def $(mkIdent n) : Array String := #[$lits,*]))
            let pq ← pkgAbsoluteLibs "libpq"
            -- DuckDB flags: a consumer's `lean_exe` needs its own, because
            -- Lake resolves `moreLinkArgs` per package — a dependency's never
            -- reach the consumer's final link (the same gap `ledger`'s
            -- lakefile documents for libpq) — and DuckDB's symbols live
            -- outside `liblinenffi.a`: in `libduckdb.dylib` on macOS, in the
            -- sealed `libduckdb_sealed.so` on Linux.
            --
            -- Both directories are anchored to *this file's* location, never
            -- to the working directory: a relative anchor here names the
            -- wrong tree from any other cwd. Absolute, so the `-rpath`
            -- baked into the executable is valid wherever it runs from (a
            -- relative rpath resolves against the binary's own directory).
            -- On macOS the sealed-library branch does not exist at all, so
            -- the flags name the unpacked `libduckdb.dylib` in the
            -- workspace's `.lake/duckdb` (where linen's lakefile downloads
            -- it when elaborated with this consumer as the root).
            let pkgDir : FilePath := (FilePath.mk (← getFileName)).parent.getD "."
            let sealedDir :=
              (pkgDir / ".." / "linen" / ".lake" / "build" / "ffi").normalize
            let dylibDir := ((← IO.currentDir) / ".lake" / "duckdb").normalize
            let duckdb : Array String :=
              if System.Platform.isOSX then
                #["-L", dylibDir.toString, "-lduckdb",
                  "-Wl,-rpath," ++ dylibDir.toString]
              else
                #["-L", sealedDir.toString, "-lduckdb_sealed",
                  "-Wl,-rpath," ++ sealedDir.toString]
            mkDef `nativeLinkArgs (pq ++ duckdb)

          package consumer

          lean_lib Consumer where
            precompileModules := true

          /-- An *executable* consumer: the shape Lake refuses to give a
              dependency's `moreLinkArgs` to, and so the only shape that would
              have caught the `-L` bug. The library above never links
              `Scrt1.o`; this does. -/
          lean_exe consumerApp where
            root := `ConsumerApp
            moreLinkArgs := nativeLinkArgs
          LAKE
          mkdir -p Consumer
          # One import per FFI-bearing subsystem, so the link covers every
          # native object: DuckDB (the sealed library), SQLite (vendored),
          # libpq, OpenSSL, zlib, and the keychain.
          cat > Consumer.lean <<'SRC'
          import Linen.Database.DuckDB.FFI.OpenConnect
          import Linen.Database.SQLite
          import Linen.Database.PostgreSQL.LibPQ
          import Linen.Crypto.JOSE.JWS
          import Linen.Crypto.Zlib.FFI
          import Linen.System.Keychain
          import Linen.Cloud

          -- Force the DuckDB FFI to be linked and called, not merely imported:
          -- the 0.19.1 bug produced a library that built and then failed to
          -- link into a consumer, so this must reach an `@[extern]` symbol.
          #eval show IO Unit from do
            match ← Database.DuckDB.FFI.OpenConnect.openDatabase none with
            | .ok db =>
              IO.println s!"duckdb {← Database.DuckDB.FFI.OpenConnect.libraryVersion}"
              Database.DuckDB.FFI.OpenConnect.close db
            | .error m => throw (IO.userError s!"consumer could not open duckdb: {m}")
          SRC
          # An *executable* consumer — the shape a dependency's `moreLinkArgs`
          # can never reach. `main` references a `linen_pg_*` and a
          # `linen_jose_hmac` symbol, pulling `postgres.o` (libpq) and `jose.o`
          # (OpenSSL) into the link, and *opens a DuckDB database for real*:
          # the executable link is the one shape where `ld.lld` checks the
          # sealed library's undefined symbols (`--no-allow-shlib-undefined`),
          # and for a whole release this job dodged DuckDB here because the
          # host C++ runtime sealed in referenced glibc symbols Lean's bundle
          # predates (`__isoc23_strtoul`, `__libc_single_threaded`,
          # `_dl_find_object`). Since `ffi/duckdb_glibc_compat.c` shims them,
          # this is the pinned regression test for that fix — and running the
          # executable (the step below) exercises the sealed library beyond
          # its link, on the rpath the consumer lakefile bakes in.
          cat > ConsumerApp.lean <<'SRC'
          import Linen.Database.PostgreSQL.LibPQ
          import Linen.Crypto.JOSE.FFI
          import Linen.Database.DuckDB.FFI.OpenConnect

          open Database.PostgreSQL.LibPQ

          def main : IO Unit := do
            -- DuckDB, opened for real: this is what the executable link
            -- exists to pin (see the comment above this file).
            match ← Database.DuckDB.FFI.OpenConnect.openDatabase none with
            | .ok db =>
              IO.println s!"duckdb {← Database.DuckDB.FFI.OpenConnect.libraryVersion}"
              Database.DuckDB.FFI.OpenConnect.close db
            | .error m => throw (IO.userError s!"consumer could not open duckdb: {m}")
            -- libpq and OpenSSL, linked but never *depended* on at run time:
            -- a refused connection is fine here, and `hmac` keeps `jose.o` on
            -- the link line (satisfied by Lean's bundled static
            -- libssl/libcrypto).
            try
              let _ ← connect "host=127.0.0.1 port=1 dbname=linktest"
            catch _ => pure ()
            let _ ← Crypto.JOSE.FFI.hmac "key".toUTF8 "data".toUTF8 0
            pure ()
          SRC
          ../linen/ci/consumer/check-link-helpers.sh lakefile.lean
          lake build Consumer
          # The regression tests: with the old `-L<libdir> -lpq` recipe this
          # executable link fails on Linux with an undefined `__libc_csu_init`
          # in Lean's vendored `Scrt1.o`; `pkgAbsoluteLibs` links it. And
          # before the glibc compat shims, the same link failed with
          # `undefined reference: __isoc23_strtoul` et al., referenced by
          # `libduckdb_sealed.so` under `--no-allow-shlib-undefined`.
          lake build consumerApp
          # The link is not the whole story: the sealed library also has to
          # *load and run* at executable scope, through the consumer's own
          # rpath rather than anything lake set up.
          .lake/build/bin/consumerApp | grep -q '^duckdb '

  # ── Does the build refuse to produce a broken library? ──────────────────────
  #
  # `duckdbSealedArchives` needs a static libstdc++, which GitHub's Ubuntu
  # runners always have because they ship `g++` — so the missing-pieces branch
  # was unreachable in CI for a whole release. On a minimal image it is
  # reachable, and an unsealed build aborts on every DuckDB error path. Since
  # 0.21.0 that is a hard failure rather than a warning, and this asserts the
  # failure happens and says something useful.
  unsealable:
    name: A host that cannot seal DuckDB fails loudly
    runs-on: ubuntu-24.04
    container: debian:bookworm-slim
    steps:
      # `debian:bookworm-slim` ships no bash, so GitHub runs steps with `sh -e`
      # (dash) until one exists. This step is therefore deliberately POSIX-only:
      # the first attempt used `set -o pipefail` and died with "Illegal option
      # -o pipefail" before testing anything. It installs bash for the steps
      # below, which declare `shell: bash` explicitly.
      - name: Minimal toolchain — deliberately no g++
        run: |
          set -eu
          apt-get update -qq
          # curl/unzip for the DuckDB download, git for elan, gcc for the C
          # shims. No g++, so no static libstdc++.a — which is the point.
          apt-get install -y -qq --no-install-recommends \
            bash curl unzip git ca-certificates gcc libc6-dev \
            libpq-dev libssl-dev zlib1g-dev libsecret-1-dev pkg-config
          if command -v g++ >/dev/null 2>&1; then
            echo "g++ is present; this job exists to test its absence" >&2
            exit 1
          fi
      - uses: actions/checkout@v7
      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          ./elan-init -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: The build must fail, naming the cause and the fix
        shell: bash
        run: |
          set -uo pipefail
          out="$(lake build Linen.Database.DuckDB.FFI.OpenConnect 2>&1)" && rc=0 || rc=$?
          echo "$out" | tail -30
          if [ "$rc" -eq 0 ]; then
            echo "::error::the build succeeded on a host that cannot seal DuckDB" >&2
            exit 1
          fi
          echo "$out" | grep -q "Cannot seal DuckDB" \
            || { echo "::error::failed, but not with the sealing message" >&2; exit 1; }
          echo "$out" | grep -q "apt-get install -y g++" \
            || { echo "::error::the message does not name the fix" >&2; exit 1; }
          echo "OK: refused to build, named the cause and the fix"
      # The opt-out is *not* a way to get a working build out of this host. The
      # pinned Linux asset is `static-libs-linux-*.zip`, which carries archives
      # and no `libduckdb.so`, so there is nothing for the unsealed path to
      # link. It leads somewhere only for a caller who supplied their own
      # DuckDB through `DUCKDB_PREFIX`.
      #
      # The first version of this step asserted the opt-out *built*, and it
      # failed with `unable to find library -lduckdb` — which was the honest
      # answer to a dishonest expectation. So the assertion is now that the
      # opt-out refuses, and names `DUCKDB_PREFIX`.
      - name: The opt-out refuses when there is no libduckdb to link
        shell: bash
        run: |
          set -uo pipefail
          out="$(LINEN_ALLOW_UNSEALED_DUCKDB=1 \
            lake build Linen.Database.DuckDB.FFI.OpenConnect 2>&1)" && rc=0 || rc=$?
          echo "$out" | tail -20
          if [ "$rc" -eq 0 ]; then
            echo "::error::the opt-out produced a build on a host with no libduckdb" >&2
            exit 1
          fi
          echo "$out" | grep -q "no shared libduckdb" \
            || { echo "::error::refused, but not for the stated reason" >&2; exit 1; }
          echo "$out" | grep -q "DUCKDB_PREFIX" \
            || { echo "::error::the message does not name DUCKDB_PREFIX" >&2; exit 1; }
          echo "OK: the opt-out refuses and names what it would need"

      # And the real message is not buried. Throwing from the middle of the
      # lakefile's `run_cmd` used to abort it before the `mkDef`s ran, so the
      # cause arrived under four `Unknown identifier nativeLinkArgs` errors that
      # pointed at the lakefile rather than the host. The check now runs last.
      - name: The failure is not buried under a cascade
        shell: bash
        run: |
          set -uo pipefail
          out="$(lake build Linen.Database.DuckDB.FFI.OpenConnect 2>&1)" && rc=0 || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error::expected this host to refuse" >&2; exit 1
          fi
          if echo "$out" | grep -q "Unknown identifier"; then
            echo "::error::the real message is buried under a cascade:" >&2
            echo "$out" | grep "Unknown identifier" >&2
            exit 1
          fi
          echo "OK: the sealing failure is the only error reported"
