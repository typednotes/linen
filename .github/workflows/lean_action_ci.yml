name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      # Never cancel one platform because another failed. These legs fail for
      # genuinely different reasons — the whole point of running them is to see
      # each one's result — and the default (fail-fast: true) threw away the
      # Linux result the moment a flaky macOS timing test failed. `release.yml`
      # already sets this; the two should not disagree.
      fail-fast: false
      matrix:
        # Three legs, one per axis that actually varies. The ~770 pure-Lean
        # modules are platform-independent and elan pins the compiler to one
        # commit, so adding distros would re-test identical `.olean` semantics.
        # Everything that varies lives at the FFI boundary:
        #
        #   ubuntu-latest      Linux x86_64 — the sealed-DuckDB path, amd64 asset
        #   ubuntu-24.04-arm   Linux arm64  — the `static-libs-linux-arm64.zip`
        #                      branch of `duckdbArchiveName`, which no CI run had
        #                      ever executed, plus arm64 static-libstdc++ discovery
        #   macos-latest       Darwin arm64 — the dynamic dylib path, no sealing
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
      # Installs libpq, OpenSSL and (on Linux) libsecret. Shared with the
      # release workflow, so the two cannot drift.
      - uses: ./.github/actions/setup-native-deps
      - uses: leanprover/lean-action@v1
      # `Tests` is not a default target, so `lean-action`'s `lake build` does
      # not reach it. Build it explicitly on every matrix leg: AGENTS.md
      # requires the full test suite to run on each platform axis whenever an
      # FFI target is in the build graph, and every `#guard`/`#guard_msgs`
      # check in the suite runs at elaboration time — so building `Tests` *is*
      # running the tests.
      - name: Build the test suite (runs every #guard check)
        run: lake build Tests

      # A symbol table is not observable from a `#guard`, and getting this
      # wrong aborts the process on every DuckDB error path rather than failing
      # the build. The seal is a property of a linked binary, so it is asserted
      # on the artifact; the script skips itself on macOS. Shared with the
      # release workflow so the two cannot drift.
      - name: Verify the sealed DuckDB library is self-contained
        run: ./ci/check-sealed-duckdb.sh

  # ── Can a consumer build against this? ──────────────────────────────────────
  #
  # The axis standalone CI cannot test. When `linen` is a dependency, Lake
  # elaborates its lakefile with the *consumer's* root as the working directory
  # while writing target outputs to `linen`'s own build directory. Built
  # standalone the two coincide, so this repository's own green CI said nothing
  # about it — and a `-L` resolved against the wrong one broke every Linux
  # consumer while CI stayed green (fixed in 0.19.1).
  #
  # Only the FFI-bearing modules are imported: the point is to link, not to
  # re-run a suite the matrix above already ran.
  consumer:
    name: Consumer build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: linen
      - uses: ./linen/.github/actions/setup-native-deps
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: linen
          build: false
          test: false
      - name: Build a package that requires linen as a dependency
        run: |
          set -euo pipefail
          mkdir -p consumer
          cd consumer
          cp ../linen/lean-toolchain .
          cat > lakefile.lean <<'LAKE'
          import Lake
          open System Lake DSL

          require linen from ".." / "linen"

          /-- Run `pkg-config <args>`, splitting stdout on whitespace. -/
          def pkgConfig (args : Array String) : IO (Array String) := do
            let out ← IO.Process.output { cmd := "pkg-config", args }
            if out.exitCode != 0 then return #[]
            let normalized := (out.stdout.replace "\n" " ").replace "\t" " "
            return (normalized.splitOn " ").filter (· != "") |>.toArray

          /-- Link flags that name each library file outright rather than adding
              its directory to `-L`. On Linux that directory is
              `/usr/lib/<multiarch>`, which holds the system `libc.so`; adding
              it shadows the glibc Lean bundles and the executable fails with
              `undefined symbol: __libc_csu_init` from Lean's vendored
              `Scrt1.o`. This is the recipe `linen` hands consumers. -/
          def pkgAbsoluteLibs (pkg : String) : IO (Array String) := do
            let libs ← pkgConfig #["--libs", pkg]
            let dirs ← pkgConfig #["--variable=libdir", pkg]
            let dir : Option String := (dirs.filter (· != ""))[0]?
            let ext := if System.Platform.isOSX then "dylib" else "so"
            let mut out : Array String := #[]
            for tok in libs do
              if tok.startsWith "-L" then
                continue
              else if tok.startsWith "-l" then
                let name := (tok.drop 2).toString
                match dir with
                | some d =>
                  let c : FilePath := (d : FilePath) / s!"lib{name}.{ext}"
                  if ← c.pathExists then out := out.push c.toString else out := out.push tok
                | none => out := out.push tok
              else
                out := out.push tok
            return out

          open Lean Elab Command in
          run_cmd do
            let mkDef (n : Name) (flags : Array String) : CommandElabM Unit := do
              let lits : Array (TSyntax `term) := flags.map (fun s => quote s)
              elabCommand (← `(def $(mkIdent n) : Array String := #[$lits,*]))
            let pq ← pkgAbsoluteLibs "libpq"
            mkDef `nativeLinkArgs pq

          package consumer

          lean_lib Consumer where
            precompileModules := true

          /-- An *executable* consumer: the shape Lake refuses to give a
              dependency's `moreLinkArgs` to, and so the only shape that would
              have caught the `-L` bug. The library above never links
              `Scrt1.o`; this does. -/
          lean_exe consumerApp where
            root := `ConsumerApp
            moreLinkArgs := nativeLinkArgs
          LAKE
          mkdir -p Consumer
          # One import per FFI-bearing subsystem, so the link covers every
          # native object: DuckDB (the sealed library), SQLite (vendored),
          # libpq, OpenSSL, zlib, and the keychain.
          cat > Consumer.lean <<'SRC'
          import Linen.Database.DuckDB.FFI.OpenConnect
          import Linen.Database.SQLite
          import Linen.Database.PostgreSQL.LibPQ
          import Linen.Crypto.JOSE.JWS
          import Linen.Crypto.Zlib.FFI
          import Linen.System.Keychain
          import Linen.Cloud

          -- Force the DuckDB FFI to be linked and called, not merely imported:
          -- the 0.19.1 bug produced a library that built and then failed to
          -- link into a consumer, so this must reach an `@[extern]` symbol.
          #eval show IO Unit from do
            match ← Database.DuckDB.FFI.OpenConnect.openDatabase none with
            | .ok db =>
              IO.println s!"duckdb {← Database.DuckDB.FFI.OpenConnect.libraryVersion}"
              Database.DuckDB.FFI.OpenConnect.close db
            | .error m => throw (IO.userError s!"consumer could not open duckdb: {m}")
          SRC
          # An *executable* consumer — the shape a dependency's `moreLinkArgs`
          # can never reach. `main` references a `linen_pg_*` and a
          # `linen_jose_hmac` symbol, pulling `postgres.o` (libpq) and `jose.o`
          # (OpenSSL) into the link; it is never run, only linked. Deliberately
          # imports no DuckDB: this repository's own `lean_exe` cannot be the
          # test, because it links `-lduckdb_sealed`, and the sealed `.so` is
          # built by the host `g++` against a newer glibc than Lean bundles
          # (`--no-allow-shlib-undefined` rejects it).
          cat > ConsumerApp.lean <<'SRC'
          import Linen.Database.PostgreSQL.LibPQ
          import Linen.Crypto.JOSE.FFI

          open Database.PostgreSQL.LibPQ

          def main : IO Unit := do
            -- References one `linen_pg_*` and one `linen_jose_hmac` symbol, so
            -- the link pulls both `postgres.o` (libpq) and `jose.o` (OpenSSL,
            -- satisfied by Lean's bundled static libssl/libcrypto). Never run,
            -- only linked.
            let _ ← connect "host=127.0.0.1 port=1 dbname=linktest"
            let _ ← Crypto.JOSE.FFI.hmac "key".toUTF8 "data".toUTF8 0
            pure ()
          SRC
          lake build Consumer
          # The regression test: with the old `-L<libdir> -lpq` recipe this
          # executable link fails on Linux with an undefined `__libc_csu_init`
          # in Lean's vendored `Scrt1.o`; `pkgAbsoluteLibs` links it.
          lake build consumerApp

  # ── Does the build refuse to produce a broken library? ──────────────────────
  #
  # `duckdbSealedArchives` needs a static libstdc++, which GitHub's Ubuntu
  # runners always have because they ship `g++` — so the missing-pieces branch
  # was unreachable in CI for a whole release. On a minimal image it is
  # reachable, and an unsealed build aborts on every DuckDB error path. Since
  # 0.21.0 that is a hard failure rather than a warning, and this asserts the
  # failure happens and says something useful.
  unsealable:
    name: A host that cannot seal DuckDB fails loudly
    runs-on: ubuntu-latest
    container: debian:bookworm-slim
    steps:
      # `debian:bookworm-slim` ships no bash, so GitHub runs steps with `sh -e`
      # (dash) until one exists. This step is therefore deliberately POSIX-only:
      # the first attempt used `set -o pipefail` and died with "Illegal option
      # -o pipefail" before testing anything. It installs bash for the steps
      # below, which declare `shell: bash` explicitly.
      - name: Minimal toolchain — deliberately no g++
        run: |
          set -eu
          apt-get update -qq
          # curl/unzip for the DuckDB download, git for elan, gcc for the C
          # shims. No g++, so no static libstdc++.a — which is the point.
          apt-get install -y -qq --no-install-recommends \
            bash curl unzip git ca-certificates gcc libc6-dev \
            libpq-dev libssl-dev zlib1g-dev libsecret-1-dev pkg-config
          if command -v g++ >/dev/null 2>&1; then
            echo "g++ is present; this job exists to test its absence" >&2
            exit 1
          fi
      - uses: actions/checkout@v5
      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          ./elan-init -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: The build must fail, naming the cause and the fix
        shell: bash
        run: |
          set -uo pipefail
          out="$(lake build Linen.Database.DuckDB.FFI.OpenConnect 2>&1)" && rc=0 || rc=$?
          echo "$out" | tail -30
          if [ "$rc" -eq 0 ]; then
            echo "::error::the build succeeded on a host that cannot seal DuckDB" >&2
            exit 1
          fi
          echo "$out" | grep -q "Cannot seal DuckDB" \
            || { echo "::error::failed, but not with the sealing message" >&2; exit 1; }
          echo "$out" | grep -q "apt-get install -y g++" \
            || { echo "::error::the message does not name the fix" >&2; exit 1; }
          echo "OK: refused to build, named the cause and the fix"
      # The opt-out is *not* a way to get a working build out of this host. The
      # pinned Linux asset is `static-libs-linux-*.zip`, which carries archives
      # and no `libduckdb.so`, so there is nothing for the unsealed path to
      # link. It leads somewhere only for a caller who supplied their own
      # DuckDB through `DUCKDB_PREFIX`.
      #
      # The first version of this step asserted the opt-out *built*, and it
      # failed with `unable to find library -lduckdb` — which was the honest
      # answer to a dishonest expectation. So the assertion is now that the
      # opt-out refuses, and names `DUCKDB_PREFIX`.
      - name: The opt-out refuses when there is no libduckdb to link
        shell: bash
        run: |
          set -uo pipefail
          out="$(LINEN_ALLOW_UNSEALED_DUCKDB=1 \
            lake build Linen.Database.DuckDB.FFI.OpenConnect 2>&1)" && rc=0 || rc=$?
          echo "$out" | tail -20
          if [ "$rc" -eq 0 ]; then
            echo "::error::the opt-out produced a build on a host with no libduckdb" >&2
            exit 1
          fi
          echo "$out" | grep -q "no shared libduckdb" \
            || { echo "::error::refused, but not for the stated reason" >&2; exit 1; }
          echo "$out" | grep -q "DUCKDB_PREFIX" \
            || { echo "::error::the message does not name DUCKDB_PREFIX" >&2; exit 1; }
          echo "OK: the opt-out refuses and names what it would need"

      # And the real message is not buried. Throwing from the middle of the
      # lakefile's `run_cmd` used to abort it before the `mkDef`s ran, so the
      # cause arrived under four `Unknown identifier nativeLinkArgs` errors that
      # pointed at the lakefile rather than the host. The check now runs last.
      - name: The failure is not buried under a cascade
        shell: bash
        run: |
          set -uo pipefail
          out="$(lake build Linen.Database.DuckDB.FFI.OpenConnect 2>&1)" && rc=0 || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error::expected this host to refuse" >&2; exit 1
          fi
          if echo "$out" | grep -q "Unknown identifier"; then
            echo "::error::the real message is buried under a cascade:" >&2
            echo "$out" | grep "Unknown identifier" >&2
            exit 1
          fi
          echo "OK: the sealing failure is the only error reported"
