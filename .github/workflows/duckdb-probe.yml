name: Linux CI probe (temporary diagnostic)

# TEMPORARY. Delete before merging.
#
# Round 1: DuckDB's C API is fine. On one runner, against the same pinned
# v1.5.4 libduckdb.so, plain C returned DuckDBError on all four error paths
# while the same call inside `lean` aborted with duckdb::CatalogException.
#
# Round 2: confirmed the mechanism and the fix.
#   - `libleanshared.so` exports 10 `_Unwind_*`; the system libstdc++ imports
#     11. Exactly four fall through to libgcc_s.so.1 —
#     `_Unwind_GetIPInfo`, `_Unwind_GetDataRelBase`, `_Unwind_GetTextRelBase`,
#     `_Unwind_Resume_or_Rethrow` — so libstdc++'s unwinding is split across
#     two unwinders and the personality routine reads a foreign context.
#   - `LD_PRELOAD=libgcc_s.so.1` fixed all nine DuckDB modules, and Lean's own
#     exception handling still passed under it. The full suite then failed on
#     exactly one module: Tests.Linen.System.KeychainTest.
#
# Round 3 (this file): get Keychain's actual error, which round 2 truncated
# with `tail -30`. Leading hypothesis: `gnome-keyring-daemon --unlock` creates
# and unlocks the `login` keyring but leaves the `default` *alias* unset, and
# `ffi/keychain.c` stores into `SECRET_COLLECTION_DEFAULT`, which resolves that
# alias. `ReadAlias("default")` returns "/" if so.

on:
  push:
    branches:
      - 'fix/linux-ci-test-failures'
  workflow_dispatch:

jobs:
  keychain:
    name: Keychain on Linux — full error and collection state
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-native-deps
      - uses: leanprover/lean-action@v1

      - name: What does the Secret Service actually expose?
        run: |
          set +e
          echo "DBUS_SESSION_BUS_ADDRESS=${DBUS_SESSION_BUS_ADDRESS:-<unset>}"
          echo "XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-<unset>}"

          echo "=== is org.freedesktop.secrets owned? ==="
          dbus-send --session --print-reply --dest=org.freedesktop.DBus \
            /org/freedesktop/DBus org.freedesktop.DBus.GetNameOwner \
            string:org.freedesktop.secrets

          echo "=== ReadAlias(\"default\") — \"/\" means NO default collection ==="
          dbus-send --session --print-reply --dest=org.freedesktop.secrets \
            /org/freedesktop/secrets org.freedesktop.Secret.Service.ReadAlias \
            string:default

          echo "=== existing collections ==="
          dbus-send --session --print-reply --dest=org.freedesktop.secrets \
            /org/freedesktop/secrets org.freedesktop.DBus.Properties.Get \
            string:org.freedesktop.Secret.Service string:Collections

          echo "=== keyring files on disk ==="
          ls -la "$HOME/.local/share/keyrings/" 2>/dev/null || echo "(no keyrings dir)"
          exit 0

      - name: Keychain test, full error output
        run: |
          set +e
          export LD_PRELOAD=/usr/lib/x86_64-linux-gnu/libgcc_s.so.1
          lake build Tests.Linen.System.KeychainTest 2>&1 | grep -vE '^(✔|ℹ|⚠)' | tail -40
          echo "KEYCHAIN exit: ${PIPESTATUS[0]}"
          exit 0

      - name: Does an explicit default alias fix it?
        run: |
          set +e
          export LD_PRELOAD=/usr/lib/x86_64-linux-gnu/libgcc_s.so.1

          # `secret-tool store` goes through libsecret's own default-collection
          # handling and will create the collection if it is missing, which also
          # establishes the alias. If Keychain passes afterwards, the fix is to
          # do this (or the equivalent) in setup-native-deps.
          sudo apt-get install -y libsecret-tools >/dev/null 2>&1
          echo "probe-secret" | secret-tool store --label="linen probe" probe linen
          echo "secret-tool store exit: $?"

          echo "=== ReadAlias(\"default\") again ==="
          dbus-send --session --print-reply --dest=org.freedesktop.secrets \
            /org/freedesktop/secrets org.freedesktop.Secret.Service.ReadAlias \
            string:default

          echo "=== rebuild KeychainTest ==="
          # Force re-elaboration: a cached failure is not re-run, and a cached
          # success would hide a regression.
          rm -f .lake/build/lib/lean/Tests/Linen/System/KeychainTest.olean
          lake build Tests.Linen.System.KeychainTest 2>&1 | grep -vE '^(✔|ℹ|⚠)' | tail -30
          echo "KEYCHAIN-AFTER-ALIAS exit: ${PIPESTATUS[0]}"
          exit 0
