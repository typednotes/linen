name: Linux CI probe (temporary diagnostic)

# TEMPORARY. Delete before merging.
#
# Settled so far:
#   R1  DuckDB's C API is fine. Plain C returned DuckDBError on all four error
#       paths; the same calls inside `lean` aborted.
#   R2  `libleanshared.so` exports 10 `_Unwind_*`, the system libstdc++ imports
#       11, and exactly four fall through to libgcc_s.so.1
#       (`_Unwind_GetIPInfo`, `_Unwind_GetDataRelBase`, `_Unwind_GetTextRelBase`,
#       `_Unwind_Resume_or_Rethrow`) — a split unwinder.
#       `LD_PRELOAD=libgcc_s.so.1` fixed all nine DuckDB modules and left the
#       suite failing on Keychain alone.
#   R3  Keychain: the Secret Service *is* up, but `ReadAlias("default")` is "/",
#       only the ephemeral `session` collection exists, and
#       `~/.local/share/keyrings` is empty. The real error is
#       `Object does not exist at path ".../collection/login"`.
#       `--unlock` unlocks an existing login keyring; it does not create one.
#
# R4 (this file), two independent questions in parallel:
#   job `keyring`  — which headless recipe actually produces a *default*
#                    collection, so SECRET_COLLECTION_DEFAULT resolves.
#   job `wrapper`  — the chosen DuckDB fix, checked cheaply before touching
#                    lakefile.lean. Static-linking DuckDB into every
#                    precompiled module dynlib is not viable (`precompileModules`
#                    is on for both libs, so ~20 DuckDB modules would each embed
#                    an 80MB archive). The viable shape is ONE self-contained
#                    shim DSO holding DuckDB + a static libstdc++/libgcc with
#                    every one of those symbols localized, exporting only the
#                    `linen_duckdb_*` entry points, which everything else links
#                    against dynamically. The decisive property is static and
#                    cheap to check: the DSO must have NO undefined `_Unwind_*`
#                    or `__cxa_*` left for Lean to interpose.

on:
  push:
    branches:
      - 'fix/linux-ci-test-failures'
  workflow_dispatch:

jobs:
  keyring:
    name: Which headless recipe yields a default collection?
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gnome-keyring dbus-x11 libsecret-tools

      - name: Recipe A — --unlock --components=secrets (what we ship now)
        run: |
          set +e
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          eval "$(dbus-launch --sh-syntax)"
          echo -n "" | gnome-keyring-daemon --unlock --components=secrets
          echo "ReadAlias(default):"
          dbus-send --session --print-reply --dest=org.freedesktop.secrets \
            /org/freedesktop/secrets org.freedesktop.Secret.Service.ReadAlias string:default
          ls -la "$HOME/.local/share/keyrings/" 2>/dev/null
          exit 0

      - name: Recipe B — --login to create it, then --start for the service
        run: |
          set +e
          rm -rf "$HOME/.local/share/keyrings"; mkdir -p "$HOME/.local/share/keyrings"
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          eval "$(dbus-launch --sh-syntax)"
          # `--login` reads the login password from stdin and CREATES the login
          # keyring if absent; `--start` then claims org.freedesktop.secrets.
          eval "$(printf '\n' | gnome-keyring-daemon --daemonize --login)"
          eval "$(gnome-keyring-daemon --start --components=secrets)"
          sleep 2
          echo "ReadAlias(default):"
          dbus-send --session --print-reply --dest=org.freedesktop.secrets \
            /org/freedesktop/secrets org.freedesktop.Secret.Service.ReadAlias string:default
          ls -la "$HOME/.local/share/keyrings/" 2>/dev/null
          echo "--- can secret-tool round-trip? ---"
          echo -n "probe-value" | secret-tool store --label="linen probe" probe linen
          echo "store exit: $?"
          secret-tool lookup probe linen; echo " <- lookup exit: $?"
          exit 0

      - name: Recipe C — CreateCollection with the 'default' alias over D-Bus
        run: |
          set +e
          rm -rf "$HOME/.local/share/keyrings"; mkdir -p "$HOME/.local/share/keyrings"
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          eval "$(dbus-launch --sh-syntax)"
          echo -n "" | gnome-keyring-daemon --unlock --components=secrets
          # Ask the service itself for a collection aliased "default".
          dbus-send --session --print-reply --dest=org.freedesktop.secrets \
            /org/freedesktop/secrets org.freedesktop.Secret.Service.CreateCollection \
            dict:string:variant:"org.freedesktop.Secret.Collection.Label","<login>" \
            string:default
          echo "ReadAlias(default):"
          dbus-send --session --print-reply --dest=org.freedesktop.secrets \
            /org/freedesktop/secrets org.freedesktop.Secret.Service.ReadAlias string:default
          exit 0

  wrapper:
    name: Can DuckDB be sealed into one self-contained DSO?
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1

      - name: Fetch the pinned archive
        run: |
          set -euo pipefail
          V="$(grep -oE 'def duckdbVersion : String := "[^"]+"' lakefile.lean | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          mkdir -p dd && cd dd
          curl -sSLO "https://github.com/duckdb/duckdb/releases/download/v${V}/libduckdb-linux-amd64.zip"
          unzip -oq libduckdb-linux-amd64.zip
          ls -la libduckdb_static.a duckdb.h

      - name: Where are the static C++ runtime archives?
        run: |
          set +e
          for a in libstdc++.a libgcc.a libgcc_eh.a; do
            p="$(g++ -print-file-name=$a)"
            echo "$a -> $p"
            [ "$p" != "$a" ] && ls -la "$p"
          done
          exit 0

      # Built with BOTH drivers: `cc` establishes whether the flags work at all,
      # and `leanc` is what Lake will actually use (its bundled clang/ld.lld),
      # so only the leanc result predicts the lakefile change.
      - name: Build the sealed wrapper DSO (cc, then leanc)
        run: |
          set +e
          LEAN_INC="$(lean --print-prefix)/include"
          STDCXX="$(g++ -print-file-name=libstdc++.a)"
          GCC_A="$(g++ -print-file-name=libgcc.a)"
          GCC_EH="$(g++ -print-file-name=libgcc_eh.a)"
          echo "stdc++=$STDCXX"; echo "gcc=$GCC_A"; echo "gcc_eh=$GCC_EH"

          cc -std=c11 -fPIC -c ffi/duckdb_shim.c -o duckdb_shim.o -I dd -I "$LEAN_INC"
          echo "compile exit: $?"

          # Seal it: DuckDB, the whole C++ runtime and the unwinder go IN, and
          # --exclude-libs localizes every symbol that came from an archive.
          # `duckdb_shim.o` is an object file, not an archive, so its
          # `linen_duckdb_*` entry points keep default visibility and stay
          # exported — which is why this must NOT use --exclude-libs,ALL.
          SEAL_ARGS="dd/libduckdb_static.a $STDCXX $GCC_EH $GCC_A
            -Wl,--exclude-libs,libduckdb_static.a:libstdc++.a:libgcc.a:libgcc_eh.a
            -lm -ldl -lpthread"

          echo "════════ cc -shared ════════"
          cc -shared -fPIC -o sealed-cc.so duckdb_shim.o $SEAL_ARGS
          echo "cc link exit: $?"; ls -la sealed-cc.so 2>/dev/null

          echo "════════ leanc -shared ════════"
          leanc -shared -fPIC -o sealed-leanc.so duckdb_shim.o $SEAL_ARGS
          echo "leanc link exit: $?"; ls -la sealed-leanc.so 2>/dev/null
          exit 0

      - name: The decisive check — is anything left to interpose?
        run: |
          set +e
          for so in sealed-cc.so sealed-leanc.so; do
            [ -f "$so" ] || { echo "════════ $so was not built ════════"; continue; }
            echo "════════ $so ════════"

            echo "--- undefined _Unwind_*/__cxa_*/personality (MUST be empty) ---"
            left="$(nm -D --undefined-only "$so" | grep -E '_Unwind_|__cxa_|__gxx_personality')"
            if [ -n "$left" ]; then
              echo "$left"
              echo "!!! STILL INTERPOSABLE — sealing did not work"
            else
              echo "OK: none left for libleanshared.so to interpose"
            fi

            echo "--- DT_NEEDED (want no libstdc++.so.6) ---"
            readelf -d "$so" | grep NEEDED

            echo "--- exported linen_duckdb_* entry points (must be > 0) ---"
            nm -D --defined-only "$so" | grep -c ' T linen_duckdb_'

            echo "--- DuckDB's own symbols exported (localized, so expect 0) ---"
            nm -D --defined-only "$so" | grep -c ' T duckdb_'
          done
          exit 0
