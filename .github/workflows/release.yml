name: Release

# Fires when a version tag is pushed:
#
#   git tag -a v0.17.0 -m "..." && git push origin v0.17.0
#
# Note that GitHub runs the workflow file **as it exists in the tagged
# commit**, not as it exists on `main`. So a tag created before this file
# existed will not trigger it, and a fix to this file only takes effect for
# tags cut after the fix is committed.
on:
  push:
    tags:
      - 'v*.*.*'
  # Retry publication for an existing tag; attest its exact main CI again.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release (e.g. v0.17.0)'
        required: true
        type: string

permissions:
  contents: read

# One release at a time per tag, and never cancel one part way: a half-created
# release is worse than a slow one.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # ── Cheap checks first ────────────────────────────────────────────────────
  #
  # Attest the full main CI (all platforms, consumer and unsealable host),
  # then check the version and release notes without rebuilding on tags.
  verify:
    name: Verify tag and notes
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      sha: ${{ steps.ci.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Wait for successful main CI for the exact tag commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: bash ci/require-main-ci.sh lean_action_ci.yml "$TAG"

      - name: Check the tag against lakefile.lean and CHANGELOG.md
        id: check
        env:
          TAG: ${{ steps.ci.outputs.tag }}
        run: |
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          # A prerelease suffix (v0.17.0-rc1) is published as a prerelease, so
          # it does not become the repository's "latest".
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          # Same script a contributor runs before tagging, so a failure here
          # is reproducible locally rather than only in CI.
          ./ci/check-release.sh "$TAG" > release-notes.md

      - name: Upload the release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 7

  # ── Publish ───────────────────────────────────────────────────────────────
  publish:
    name: Publish the release
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      # The only write this workflow needs.
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      - name: Download the release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          FLAGS=()
          if [[ "$PRERELEASE" == "true" ]]; then
            FLAGS+=(--prerelease)
          fi
          # No build artifacts are attached, deliberately. `linen` is consumed
          # as source — `require linen from git "…" @ "v0.17.0"` — so the tag
          # itself is the artifact. `.olean` files are tied to one Lean
          # toolchain and one platform, and publishing them would invite
          # someone to depend on a binary that silently stops matching their
          # compiler.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; updating its notes."
            gh release edit "$TAG" \
              --title "linen $VERSION" \
              --notes-file release-notes.md \
              "${FLAGS[@]}"
          else
            gh release create "$TAG" \
              --title "linen $VERSION" \
              --notes-file release-notes.md \
              --verify-tag \
              "${FLAGS[@]}"
          fi
          echo "Published: $(gh release view "$TAG" --json url --jq .url)"
